[project]
name = "vol-research"
version = "0.1.0"
description = "Options volatility research on BTC/ETH: implied vs realised, Deribit vs on-chain venues"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyarrow>=14", "requests>=2.31", "matplotlib>=3.7", "scipy>=1.10"]
[project.optional-dependencies]
dev = ["pytest>=7"]
[tool.setuptools.packages.find]
include = ["vr*"]
